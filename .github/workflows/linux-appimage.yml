name: Build Linux AppImage

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/linux-appimage.yml'
      - 'DNSHop.sln'
      - 'DNSHopLogo.png'
      - 'New Public DNS Resolvers.ini'
      - 'package-linux-appimage.sh'
      - 'publish-linux-appimage.sh'
      - 'publish-linux-x64.sh'
      - 'src/DNSHop.App/**'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Make scripts executable
        run: chmod +x package-linux-appimage.sh publish-linux-appimage.sh publish-linux-x64.sh

      - name: Publish AppImage
        run: ./publish-linux-appimage.sh

      - name: Rename AppImage with tag suffix
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          mv artifacts/DNSHop-linux-x86_64.AppImage "artifacts/DNS-Hop-AppImage-${TAG}-x86_64.AppImage"

      - name: Generate checksum
        run: |
          cd artifacts
          for f in DNSHop-linux-x86_64.AppImage DNS-Hop-AppImage-*-x86_64.AppImage; do
            [ -f "$f" ] && sha256sum "$f" > "${f}.sha256"
          done

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: dns-hop-linux-appimage
          if-no-files-found: error
          path: |
            artifacts/DNSHop-linux-x86_64.AppImage
            artifacts/DNS-Hop-AppImage-*-x86_64.AppImage
            artifacts/*.sha256

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/DNS-Hop-AppImage-*-x86_64.AppImage
            artifacts/DNS-Hop-AppImage-*-x86_64.AppImage.sha256
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    name: Smoke test on ${{ matrix.name }}
    needs: build-appimage
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 12
            image: debian:12
            install: apt-get update && apt-get install -y --no-install-recommends bash ca-certificates libicu72
          - name: Fedora 41
            image: fedora:41
            install: dnf install -y bash ca-certificates libicu
          - name: Arch
            image: archlinux:latest
            install: pacman -Sy --noconfirm bash ca-certificates icu

    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: dns-hop-linux-appimage
          path: artifacts

      - name: Pick AppImage filename
        id: pick
        run: |
          if ls artifacts/DNS-Hop-AppImage-*-x86_64.AppImage 1>/dev/null 2>&1; then
            APPIMAGE="$(ls artifacts/DNS-Hop-AppImage-*-x86_64.AppImage | head -1)"
          else
            APPIMAGE="artifacts/DNSHop-linux-x86_64.AppImage"
          fi
          echo "appimage=${APPIMAGE}" >> "$GITHUB_OUTPUT"

      - name: Run smoke test in ${{ matrix.name }}
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
          DISTRO_INSTALL: ${{ matrix.install }}
          APPIMAGE_FILE: ${{ steps.pick.outputs.appimage }}
        run: |
          chmod +x "$APPIMAGE_FILE"
          docker run --rm \
            -e APPIMAGE_EXTRACT_AND_RUN=1 \
            -v "${PWD}/artifacts:/artifacts" \
            "$DISTRO_IMAGE" \
            /bin/sh -lc "
              set -eu
              $DISTRO_INSTALL
              chmod +x /${APPIMAGE_FILE}
              /${APPIMAGE_FILE} --smoke-test
            "
